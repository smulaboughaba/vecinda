<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bussiness model canva Vecinda</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --ink: #111827;
    --ink-border: #18181b;
    --muted: #52606d;
    --line: #e2e6ec;
    --line-strong: #cbd2d9;
    --brand: #0f766e;
    --brand-d: #0b5a54;
    --soft: #d9efec;
    --ok: #15803d;
    --ok-bg: #dcfce7;
    --ok-bd: #bbf7d0;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --warn-bd: #fde68a;
    --bad: #b91c1c;
    --bad-bg: #fee2e2;
    --bad-bd: #fecaca;
    --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-sheet: 0 12px 36px rgba(15, 23, 42, 0.08);
    --shadow-card: 0 4px 12px rgba(15, 23, 42, 0.1);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    color: var(--ink);
    background: var(--bg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    font-variant-numeric: tabular-nums;
    line-height: 1.4;
  }

  .app {
    max-width: 1560px;
    margin: 0 auto;
    padding: 16px 20px 44px;
  }

  /* Barra superior compacta de herramientas */
  .toolbar {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 11px 15px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 14px;
  }

  .toolbar-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .group-label {
    font-size: 11.5px;
    font-weight: 700;
    color: var(--muted);
    margin-right: 2px;
  }

  .btn {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 6px 11px;
    border-radius: 9px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: background .15s, border-color .15s, transform .1s;
  }

  .btn:hover { background: var(--surface-soft); border-color: #9aa5b1; }
  .btn:active { transform: translateY(1px); }

  .btn.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }
  .btn.primary:hover { background: var(--brand-d); border-color: var(--brand-d); }

  .btn.soft {
    background: var(--soft);
    border-color: transparent;
    color: var(--brand-d);
  }
  .btn.soft:hover { background: #c5e8e4; }

  .btn.active-toggle {
    background: #18181b;
    border-color: #18181b;
    color: #fff;
  }

  .btn.danger {
    color: var(--bad);
    border-color: var(--bad-bd);
    background: #fff8f8;
  }
  .btn.danger:hover { background: var(--bad-bg); }

  .chip {
    border: 1px solid var(--line-strong);
    background: var(--surface-soft);
    color: var(--ink);
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all .15s ease;
  }

  .chip:hover { background: #eef2f6; }
  .chip.active {
    background: #18181b;
    border-color: #18181b;
    color: #fff;
  }

  .chip.corr-chip.active {
    background: var(--corr-color, var(--brand));
    border-color: var(--corr-color, var(--brand));
    color: #fff;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.14);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 99px;
    display: inline-block;
    flex-shrink: 0;
  }

  .search-input {
    border: 1px solid var(--line-strong);
    border-radius: 9px;
    padding: 6px 10px;
    font: inherit;
    font-size: 12.5px;
    min-width: 190px;
    background: var(--surface-soft);
    color: var(--ink);
  }

  .search-input:focus {
    outline: 2px solid rgba(15, 118, 110, 0.22);
    border-color: var(--brand);
    background: #fff;
  }

  .toggle-label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }

  /* Insight de correlación */
  .corr-insight {
    margin-bottom: 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 5px solid var(--corr-color, var(--brand));
    border-radius: 14px;
    padding: 12px 16px;
    box-shadow: var(--shadow-sm);
    display: grid;
    grid-template-columns: 1.45fr 1fr 1fr;
    gap: 14px;
    align-items: start;
  }

  .corr-insight h2 {
    margin: 0 0 4px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .corr-insight p { margin: 0; font-size: 12.5px; color: var(--muted); }

  .insight-box {
    background: var(--surface-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 11px;
    font-size: 12px;
  }

  .insight-box strong {
    display: block;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 2px;
  }

  /* LÁMINA PRINCIPAL DEL CANVAS (estilo plantilla subida) */
  .bmc-sheet {
    background: #ffffff;
    border: 1px solid #e6e8ec;
    border-radius: 22px;
    padding: 26px 28px 24px;
    box-shadow: var(--shadow-sheet);
  }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }

  .sheet-title-wrap {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sheet-title {
    margin: 0;
    font-size: clamp(20px, 2.3vw, 31px);
    font-weight: 800;
    letter-spacing: 0.22em;
    color: #111111;
    text-transform: uppercase;
    line-height: 1.15;
  }

  .sheet-sub {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
  }

  .mini-seg {
    width: 110px;
    height: 6px;
    border-radius: 99px;
    background: #e5e7eb;
    overflow: hidden;
    display: inline-flex;
  }

  .seg-def { background: var(--ok); }
  .seg-hip { background: #f59e0b; }
  .seg-ind { background: var(--bad); }

  .canvas-stage {
    position: relative;
  }

  .corr-svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 6;
    overflow: visible;
  }

  .bmc-board {
    position: relative;
    z-index: 2;
  }

  .bmc-top {
    display: grid;
    grid-template-columns: 1.12fr 0.92fr 1.14fr 0.92fr 1.12fr;
    grid-template-rows: minmax(225px, auto) minmax(225px, auto);
    gap: 14px;
  }

  .bmc-bottom {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  /* Posicionamiento Osterwalder dentro de .bmc-top */
  .b-socios      { grid-column: 1 / 2; grid-row: 1 / 3; }
  .b-actividades { grid-column: 2 / 3; grid-row: 1 / 2; }
  .b-recursos    { grid-column: 2 / 3; grid-row: 2 / 3; }
  .b-propuesta   { grid-column: 3 / 4; grid-row: 1 / 3; }
  .b-relaciones  { grid-column: 4 / 5; grid-row: 1 / 2; }
  .b-canales     { grid-column: 4 / 5; grid-row: 2 / 3; }
  .b-segmentos   { grid-column: 5 / 6; grid-row: 1 / 3; }

  /* Colores pastel exactos de la plantilla subida */
  .b-socios      { background: #FCD25A; }
  .b-actividades { background: #FBE5DE; }
  .b-recursos    { background: #B5E2D1; }
  .b-propuesta   { background: #8DCBF5; }
  .b-relaciones  { background: #E5C29F; }
  .b-canales     { background: #FAA6C7; }
  .b-segmentos   { background: #DCF2B0; }
  .b-costes      { background: #F47D92; min-height: 205px; }
  .b-ingresos    { background: #FEEA9F; min-height: 205px; }

  .block {
    border: 1.8px solid var(--ink-border);
    border-radius: 18px;
    padding: 13px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: opacity .2s ease, transform .15s ease, box-shadow .2s ease;
    position: relative;
  }

  .block.block-dim {
    opacity: 0.52;
    filter: saturate(0.75);
  }

  .block.block-lit {
    box-shadow: 0 0 0 2.5px var(--corr-color, var(--brand)), 0 10px 22px rgba(15, 23, 42, 0.12);
  }

  .block-head {
    display: flex;
    flex-direction: column;
    gap: 6px;
    position: relative;
    padding: 0 26px;
  }

  .block-title {
    margin: 0;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: #111111;
    text-align: center;
    text-transform: uppercase;
    line-height: 1.2;
  }

  .block-add {
    position: absolute;
    right: 0;
    top: -2px;
    width: 22px;
    height: 22px;
    border-radius: 7px;
    border: 1px solid rgba(24, 24, 27, 0.22);
    background: rgba(255, 255, 255, 0.65);
    color: #111111;
    font-weight: 800;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    transition: background .15s;
  }

  .block-add:hover { background: rgba(255, 255, 255, 0.95); }

  .block-meta-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
  }

  .block-bar {
    flex: 1;
    max-width: 110px;
    height: 4px;
    border-radius: 99px;
    background: rgba(24, 24, 27, 0.14);
    overflow: hidden;
    display: flex;
  }

  .block-count {
    font-size: 10.5px;
    font-weight: 700;
    color: rgba(17, 24, 39, 0.72);
  }

  .block-body {
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex: 1;
  }

  .b-costes .block-body,
  .b-ingresos .block-body {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(225px, 1fr));
    align-content: start;
    gap: 8px;
  }

  /* Tarjetas dentro de los bloques pastel */
  .item {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(2px);
    border: 1px solid rgba(24, 24, 27, 0.14);
    border-radius: 10px;
    padding: 7px 9px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .15s ease, border-color .15s ease, opacity .2s ease, background .15s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .item:hover {
    background: rgba(255, 255, 255, 0.98);
    border-color: rgba(24, 24, 27, 0.45);
    box-shadow: var(--shadow-card);
    transform: translateY(-1px);
  }

  .item.dimmed {
    opacity: 0.25;
  }

  .item.highlighted {
    background: #ffffff;
    border: 2px solid var(--corr-color, var(--brand));
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.14);
  }

  .item-row-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 6px;
  }

  .item-title-wrap {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    min-width: 0;
  }

  .st-dot {
    font-size: 11px;
    line-height: 1.3;
    flex-shrink: 0;
  }

  .item-title {
    font-size: 12px;
    font-weight: 700;
    color: #111827;
    line-height: 1.28;
  }

  .item-corr-dots {
    display: flex;
    align-items: center;
    gap: 3px;
    flex-shrink: 0;
    padding-top: 3px;
  }

  .mini-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.8);
  }

  .item-desc {
    font-size: 11.2px;
    color: #374151;
    line-height: 1.35;
  }

  .item-corrs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 1px;
  }

  .corr-pill {
    font-size: 9.8px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    border: 1px solid currentColor;
    background: rgba(255, 255, 255, 0.9);
    white-space: nowrap;
  }

  .status-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 99px;
    display: inline-flex;
    align-items: center;
    gap: 3px;
    white-space: nowrap;
  }

  .st-definido { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-bd); }
  .st-hipotesis { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-bd); }
  .st-indeterminado { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-bd); }

  .empty-block {
    font-size: 11.5px;
    color: rgba(17, 24, 39, 0.65);
    text-align: center;
    padding: 14px 8px;
    border: 1px dashed rgba(24, 24, 27, 0.25);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.45);
  }

  /* KPI strip debajo de la lámina */
  .kpi-strip {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(4, minmax(150px, 1fr)) 1.5fr;
    gap: 10px;
    align-items: stretch;
  }

  .kpi-card, .kpi-progress {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 11px 14px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .kpi-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }

  .kpi-value {
    font-size: 21px;
    font-weight: 800;
    margin-top: 2px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .kpi-value small { font-size: 12px; font-weight: 600; color: var(--muted); }

  .seg-bar {
    height: 10px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    display: flex;
    margin: 6px 0 4px;
  }

  .seg-bar > span { height: 100%; transition: width .25s ease; }

  /* Sección inferior de diagnóstico y simulador */
  .lower-grid {
    margin-top: 14px;
    display: grid;
    grid-template-columns: 1.05fr 1fr 1.05fr;
    gap: 14px;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .panel h2 {
    margin: 0;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-sub {
    margin: -6px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }

  .maturity-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .mat-row {
    display: grid;
    grid-template-columns: 156px 1fr 74px;
    gap: 10px;
    align-items: center;
    font-size: 12px;
  }

  .mat-name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .mat-swatch {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    border: 1px solid var(--ink-border);
    flex-shrink: 0;
  }

  .mat-bar {
    height: 9px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    display: flex;
  }

  .mat-pct {
    text-align: right;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 600;
  }

  .sim-controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 14px;
  }

  .sim-field label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    margin-bottom: 4px;
  }

  .sim-field label strong { color: var(--ink); }
  .sim-field input[type="range"] { width: 100%; accent-color: var(--brand); cursor: pointer; }

  .sim-results {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .sim-metric {
    background: var(--surface-soft);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 10px 12px;
  }

  .sim-metric span {
    display: block;
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  .sim-metric strong {
    display: block;
    margin-top: 2px;
    font-size: 18px;
    color: var(--brand-d);
  }

  .hyp-note {
    font-size: 11.5px;
    color: var(--warn);
    background: #fffbeb;
    border: 1px dashed #f5d38a;
    border-radius: 10px;
    padding: 8px 10px;
  }

  .gaps-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 330px;
    overflow: auto;
    padding-right: 2px;
  }

  .gap-item {
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 9px 11px;
    background: var(--surface-soft);
    cursor: pointer;
    transition: border-color .15s;
  }

  .gap-item:hover { border-color: var(--brand); }

  .gap-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 3px;
  }

  .gap-block {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.5);
    backdrop-filter: blur(2px);
    display: none;
    place-items: center;
    padding: 16px;
    z-index: 50;
  }

  .modal-backdrop.open { display: grid; }

  .modal {
    width: min(560px, 100%);
    max-height: 92vh;
    overflow: auto;
    background: #fff;
    border-radius: 18px;
    border: 1px solid var(--line);
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.24);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .modal-head h3 { margin: 0; font-size: 17px; }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .field input, .field select, .field textarea {
    width: 100%;
    font: inherit;
    font-size: 13px;
    padding: 9px 10px;
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }

  .corr-checks {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }

  .corr-check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line-strong);
    border-radius: 99px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .corr-check input { width: auto; margin: 0; }

  .modal-foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 4px;
    flex-wrap: wrap;
  }

  .error-banner {
    background: var(--bad-bg);
    border: 1px solid var(--bad-bd);
    color: var(--bad);
    border-radius: 14px;
    padding: 18px;
    margin: 24px auto;
    max-width: 720px;
    font-size: 14px;
  }

  @media (max-width: 1120px) {
    .bmc-top {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto;
    }
    .b-socios, .b-actividades, .b-recursos, .b-propuesta, .b-relaciones, .b-canales, .b-segmentos {
      grid-column: auto;
      grid-row: auto;
    }
    .b-segmentos { grid-column: span 2; }
    .bmc-bottom { grid-template-columns: 1fr; }
    .corr-insight { grid-template-columns: 1fr; }
    .kpi-strip { grid-template-columns: repeat(2, 1fr); }
    .kpi-progress { grid-column: 1 / -1; }
    .lower-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 700px) {

function buildDynamicPricingTexts() {
  const s = VECINDA_CONFIG.suscripcion;
  const [lo, hi] = s.rangoObjetivo;
  const rLo = resumenPrecio(lo, "mensual");
  const rMid = resumenPrecio(Math.round((lo + hi) / 2), "mensual");
  const rHi = resumenPrecio(hi, "mensual");
  const rLoAnual = resumenPrecio(lo, "anual");
  const descPct = Math.round((s.mesesGratisAnual / 12) * 1000) / 10;

  const saasDesc =
    `${eurP(s.cuotaBaseMensual)}/mes hasta ${s.viviendasIncluidas} viv. + ${eurP(s.extraPorVivienda)}/mes por viv. extra. ` +
    `Ej.: ${lo} viv. → ${eurP(rLo.mensual)}/mes (${eurP(rLo.porVivienda)}/viv.); ` +
    `${rMid.viviendas} viv. → ${eurP(rMid.mensual)}/mes (${eurP(rMid.porVivienda)}/viv.); ` +
    `${hi} viv. → ${eurP(rHi.mensual)}/mes (${eurP(rHi.porVivienda)}/viv.). ` +
    `Anual: ${s.mesesGratisAnual} meses gratis (~${descPct}% dto., desde ${eurP(rLoAnual.totalPeriodo)}/año).`;

  const serviciosText = VECINDA_CONFIG.servicios
    .map(sv => `${sv.icono} ${sv.nombre}: ${eurP(sv.precio)} (${sv.unidad})`)
    .join(" · ");

  const m = VECINDA_CONFIG.marketplace;
  const cMin = Math.round(m.comisionObraCerrada[0] * 100);
  const cMax = Math.round(m.comisionObraCerrada[1] * 100);

  return {
    rangoObjetivoLabel: `${lo}–${hi} viviendas`,
    saasDesc,
    serviciosText,
    marketplaceDesc: `Gratis para la comunidad (${eurP(m.costeParaComunidad)}): ${m.presupuestosPorSolicitud} presupuestos por incidencia. Monetización en meses 5–6 vía pay-per-lead o comisión del ${cMin}%–${cMax}% sobre obra cerrada.`,
    presupuestosCount: m.presupuestosPorSolicitud,
    nota: VECINDA_CONFIG.notaValidacion,
  };
}

let state = null;
let editingId = null;

function createInitialState() {
  const [lo, hi] = VECINDA_CONFIG.suscripcion.rangoObjetivo;
  return {
    items: buildSeedItems(),
    filterStatus: "todos",
    activeCorr: null,
    showLines: true,
    compact: true,
    search: "",
    sim: {
      comunidades: 25,
      viviendas: Math.round((lo + hi) / 2),
      pctAnual: 40,
      addonsAnio: 35,
    },
  };
}

function loadState() {
  const fresh = createInitialState();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return fresh;
    const saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.items)) return fresh;
    const validBlocks = new Set(BLOCKS.map(b => b.id));
    const validCorrs = new Set(CORRELATIONS.map(c => c.id));
    const items = saved.items
      .filter(it => it && validBlocks.has(it.block) && STATUS_META[it.status])
      .map(it => ({
        id: String(it.id || ("it-" + Math.random().toString(36).slice(2, 8))),
        block: it.block,
        status: it.status,
        title: String(it.title || "Sin título"),
        desc: String(it.desc || ""),
        note: String(it.note || ""),
        corrs: Array.isArray(it.corrs) ? it.corrs.filter(c => validCorrs.has(c)) : [],
      }));
    return {
      ...fresh,
      items: items.length ? items : fresh.items,
      filterStatus: STATUS_META[saved.filterStatus] || saved.filterStatus === "todos" ? saved.filterStatus : "todos",
      activeCorr: validCorrs.has(saved.activeCorr) ? saved.activeCorr : null,
      showLines: typeof saved.showLines === "boolean" ? saved.showLines : true,
      compact: typeof saved.compact === "boolean" ? saved.compact : true,
      search: String(saved.search || ""),
      sim: { ...fresh.sim, ...(saved.sim || {}) },
    };
  } catch (e) {
    return fresh;
  }
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {}
}

const esc = s => String(s)
  .replace(/&/g, "&amp;")
  .replace(/</g, "&lt;")
  .replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

function computeStats(items) {
  const total = items.length || 1;
  let definido = 0, hipotesis = 0, indeterminado = 0, score = 0;
  for (const it of items) {
    if (it.status === "definido") definido++;
    else if (it.status === "hipotesis") hipotesis++;
    else indeterminado++;
    score += STATUS_META[it.status].weight;
  }
  return {
    count: items.length,
    definido,
    hipotesis,
    indeterminado,
    pctDef: Math.round((definido / total) * 100),
    pctHip: Math.round((hipotesis / total) * 100),
    pctInd: Math.round((indeterminado / total) * 100),
    madurez: items.length ? Math.round((score / items.length) * 100) : 0,
  };
}

function getCorr(id) {
  return CORRELATIONS.find(c => c.id === id) || null;
}

function matchesFilter(item) {
  if (state.filterStatus !== "todos" && item.status !== state.filterStatus) return false;
  if (state.search.trim()) {
    const q = state.search.trim().toLowerCase();
    const hay = `${item.title} ${item.desc} ${item.note}`.toLowerCase();
    if (!hay.includes(q)) return false;
  }
  return true;
}

function computeSimulatorOutput() {
  const s = state.sim;
  const rMes = resumenPrecio(s.viviendas, "mensual");
  const rAnu = resumenPrecio(s.viviendas, "anual");
  const frAnual = s.pctAnual / 100;
  const frMes = 1 - frAnual;
  const comunidadesMes = s.comunidades * frMes;
  const comunidadesAnu = s.comunidades * frAnual;
  const mrrSuscripcion = comunidadesMes * rMes.mensual + comunidadesAnu * rAnu.equivMensual;
  const mrrAddons = (s.comunidades * s.addonsAnio) / 12;
  const mrrTotal = mrrSuscripcion + mrrAddons;
  const arrTotal = mrrTotal * 12;
  const costeVecinoMes = rMes.porVivienda * frMes + rAnu.porVivienda * frAnual;
  return { rMes, rAnu, mrrSuscripcion, mrrAddons, mrrTotal, arrTotal, costeVecinoMes };
}

        ${renderSimResultsHTML(out)}
      </div>
      <div class="hyp-note">
        ⚠️ ${esc(VECINDA_CONFIG.notaValidacion)} Estima ingresos brutos por suscripción + servicios; no descuenta costes cloud, SEPA, burofax ni CAC ni suma el futuro marketplace de gremios.
      </div>
    </section>
  `;
}

function renderSimResultsHTML(out) {
  return `
    <div class="sim-metric">
      <span>Cuota finca (mensual / equiv. anual)</span>
      <strong>${eurP(out.rMes.mensual)} <small style="font-size:12px;color:var(--muted)">/ ${eurP(out.rAnu.equivMensual)}</small></strong>
    </div>
    <div class="sim-metric">
      <span>Coste equivalente por vecino</span>
      <strong>${eurP(out.costeVecinoMes)}/mes</strong>
    </div>
    <div class="sim-metric">
      <span>MRR estimado (Suscripción + Add-ons)</span>
      <strong>${eurP(out.mrrTotal)}</strong>
    </div>
    <div class="sim-metric">
      <span>ARR estimado</span>
      <strong>${eurP(out.arrTotal)}</strong>
    </div>
  `;
}

function renderGapsPanel() {
  const priorityRank = { indeterminado: 0, hipotesis: 1, definido: 2 };
  const gaps = state.items
    .filter(it => it.status !== "definido")
    .sort((a, b) => priorityRank[a.status] - priorityRank[b.status]);

  return `
    <section class="panel">
      <h2>🧭 Qué falta determinar (${gaps.length} frentes)</h2>
      <p class="panel-sub">Haz clic en cualquier brecha para editarla o registrar evidencia de validación.</p>
      <div class="gaps-list">
        ${gaps.map(g => {
          const st = STATUS_META[g.status];
          const b = BLOCKS.find(x => x.id === g.block);
          return `
            <div class="gap-item" onclick="openModal('${esc(g.id)}')">
              <div class="gap-top">
                <span class="gap-block">${esc(b.title)}</span>
                <span class="status-badge ${st.cls}">${st.emoji} ${st.short}</span>
              </div>
              <div style="font-size:12.5px;font-weight:700">${esc(g.title)}</div>
              <div style="font-size:11.5px;color:var(--muted);margin-top:2px">${esc(g.note || g.desc)}</div>
            </div>
          `;
        }).join("")}
      </div>
    </section>
  `;
}

function drawCorrelationLines() {
  const svg = document.getElementById("corr-svg");
  const stage = document.getElementById("canvas-stage");
  if (!svg || !stage) return;

  const corr = getCorr(state.activeCorr);
  if (!corr || !state.showLines || window.innerWidth <= 700) {
    svg.innerHTML = "";
    return;
  }

  const stageRect = stage.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${Math.max(1, stageRect.width)} ${Math.max(1, stageRect.height)}`);

  const blockAnchors = [];
  for (const b of BLOCKS) {
    const blockEl = stage.querySelector(`[data-block-id="${b.id}"]`);
    if (!blockEl) continue;
    const hitCards = [...blockEl.querySelectorAll('[data-corr-hit="1"]')];
    if (!hitCards.length) continue;

    let sx = 0, sy = 0;
    for (const card of hitCards) {
      const r = card.getBoundingClientRect();
      sx += (r.left + r.width / 2) - stageRect.left;
      sy += (r.top + r.height / 2) - stageRect.top;
    }
    blockAnchors.push({ id: b.id, x: sx / hitCards.length, y: sy / hitCards.length });
  }

  if (blockAnchors.length < 2) {
    svg.innerHTML = "";
    return;
  }

  const hub = blockAnchors.find(a => a.id === "propuesta") || blockAnchors[0];
  let paths = "";
  for (const pt of blockAnchors) {
    if (pt === hub) continue;
    const dx = (pt.x - hub.x) * 0.45;
    const dy = (pt.y - hub.y) * 0.15;
    const d = `M ${hub.x.toFixed(1)} ${hub.y.toFixed(1)} C ${(hub.x + dx).toFixed(1)} ${(hub.y - dy).toFixed(1)}, ${(pt.x - dx).toFixed(1)} ${(pt.y + dy).toFixed(1)}, ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`;
    paths += `<path d="${d}" fill="none" stroke="${corr.color}" stroke-width="2.5" stroke-opacity="0.58" stroke-dasharray="6 4"/>`;
    paths += `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="4.5" fill="${corr.color}" fill-opacity="0.9" stroke="#fff" stroke-width="1.5"/>`;
  }
  paths += `<circle cx="${hub.x.toFixed(1)}" cy="${hub.y.toFixed(1)}" r="6" fill="${corr.color}" stroke="#fff" stroke-width="2"/>`;
  svg.innerHTML = paths;
}

function render() {
  const root = document.getElementById("root");
  if (!root) return;
  const stats = computeStats(state.items);
  root.innerHTML = [
    renderToolbar(),
    renderCorrInsight(),
    renderCanvasSheet(stats),
    renderKpiStrip(stats),
    `<div class="lower-grid">${renderMaturityPanel()}${renderSimulatorPanel()}${renderGapsPanel()}</div>`,
  ].join("");
  requestAnimationFrame(drawCorrelationLines);
}

/* Acciones de UI */
function setFilterStatus(st) { state.filterStatus = st; saveState(); render(); }
function toggleCorr(id) { state.activeCorr = state.activeCorr === id ? null : id; saveState(); render(); }
function toggleLines(val) { state.showLines = !!val; saveState(); drawCorrelationLines(); }
function toggleCompact() { state.compact = !state.compact; saveState(); render(); }
function setSearch(val) {
  state.search = val;
  saveState();
  const activeEl = document.activeElement;
  const pos = activeEl && activeEl.selectionStart;
  render();
  const inp = document.querySelector(".search-input");
  if (inp) {
    inp.focus();
    if (typeof pos === "number") inp.setSelectionRange(pos, pos);
  }
}

function updateSim(key, raw) {
  const v = Number(raw);
  if (!Number.isFinite(v)) return;
  state.sim[key] = key === "viviendas" ? normalizarViviendas(v) : v;
  saveState();
  const out = computeSimulatorOutput();
  const map = {
    comunidades: ["sv-com", String(state.sim.comunidades)],
    viviendas: ["sv-viv", String(state.sim.viviendas)],
    pctAnual: ["sv-anu", `${state.sim.pctAnual}%`],
    addonsAnio: ["sv-add", eurP(state.sim.addonsAnio)],
  };
  const target = map[key];
  if (target && document.getElementById(target[0])) {
    document.getElementById(target[0]).textContent = target[1];
  }
  const box = document.getElementById("sim-results");
  if (box) box.innerHTML = renderSimResultsHTML(out);
}

function openModal(itemId, defaultBlock = "propuesta") {
  editingId = itemId;
  const item = itemId ? state.items.find(x => x.id === itemId) : {
    id: null,
    block: defaultBlock,
    status: "hipotesis",
    title: "",
    desc: "",
    note: "",
    corrs: state.activeCorr ? [state.activeCorr] : [],
  };
  if (!item) return;

  document.getElementById("modal-title").textContent = itemId ? "Editar aspecto del Canvas" : "Nuevo aspecto del Canvas";
  document.getElementById("m-block").innerHTML = BLOCKS.map(b => `<option value="${b.id}">${esc(b.title)}</option>`).join("");
  document.getElementById("m-status").innerHTML = Object.entries(STATUS_META).map(([k, v]) => `<option value="${k}">${v.emoji} ${esc(v.label)}</option>`).join("");

  document.getElementById("m-block").value = item.block;
  document.getElementById("m-status").value = item.status;
  document.getElementById("m-title").value = item.title;
  document.getElementById("m-desc").value = item.desc;
  document.getElementById("m-note").value = item.note;
  document.getElementById("m-delete").style.display = itemId ? "inline-flex" : "none";

  document.getElementById("m-corrs").innerHTML = CORRELATIONS.map(c => `
    <label class="corr-check" style="border-color:${item.corrs.includes(c.id) ? c.color : "var(--line-strong)"}">
      <input type="checkbox" value="${c.id}" ${item.corrs.includes(c.id) ? "checked" : ""}>
      <span class="dot" style="background:${c.color}"></span>
      ${esc(c.short)}
    </label>
  `).join("");

  const bd = document.getElementById("modal-backdrop");
  bd.classList.add("open");
  bd.setAttribute("aria-hidden", "false");
  document.getElementById("m-title").focus();
}

function closeModal() {
  const bd = document.getElementById("modal-backdrop");
  bd.classList.remove("open");
  bd.setAttribute("aria-hidden", "true");
  editingId = null;
}

function saveModalItem() {
  const title = document.getElementById("m-title").value.trim();
  if (!title) return alert("Escribe un título para la tarjeta.");
  const block = document.getElementById("m-block").value;
  const status = document.getElementById("m-status").value;
  const desc = document.getElementById("m-desc").value.trim();
  const note = document.getElementById("m-note").value.trim();
  const corrs = [...document.querySelectorAll('#m-corrs input[type="checkbox"]:checked')].map(el => el.value);

  if (editingId) {
    const target = state.items.find(x => x.id === editingId);
    if (target) Object.assign(target, { block, status, title, desc, note, corrs });
  } else {
    state.items.push({ id: "custom-" + Date.now(), block, status, title, desc, note, corrs });
  }
  saveState();
  closeModal();
  render();
}

function deleteModalItem() {
  if (!editingId) return;
  if (!confirm("¿Eliminar esta tarjeta del Canvas?")) return;
  state.items = state.items.filter(x => x.id !== editingId);
  saveState();
  closeModal();
  render();
}

function resetCanvas() {
  if (!confirm("¿Restaurar el Canvas base de Vecinda? Se perderán las tarjetas editadas.")) return;
  state = createInitialState();
  saveState();
  render();
}

function exportJSON() {
  const payload = {
    proyecto: "Vecinda",
    exportado: new Date().toISOString(),
    resumenDeterminacion: computeStats(state.items),
    correlaciones: CORRELATIONS,
    items: state.items,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "vecinda-business-model-canvas.json";
  a.click();
}

function init() {
  if (typeof VECINDA_CONFIG === "undefined") {
    document.getElementById("root").innerHTML = `
      <div class="error-banner">
        <strong>No se pudo cargar <code>pricing.js</code>.</strong>
        <p>Asegúrate de que <code>pricing.js</code> está en la misma carpeta que <code>canvas.html</code> para construir las tarifas dinámicamente.</p>
      </div>
    `;
    return;
  }

  state = loadState();
  render();

  window.addEventListener("resize", () => requestAnimationFrame(drawCorrelationLines));
  document.getElementById("modal-backdrop").addEventListener("click", e => {
    if (e.target.id === "modal-backdrop") closeModal();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeModal();
  });
}

if (typeof document !== "undefined") {
  init();
}
</script>
</body>
